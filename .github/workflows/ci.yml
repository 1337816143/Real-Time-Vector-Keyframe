name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Deterministic geometry and resource lifecycle regressions
        run: npm test
      - name: Build production and actual-engine GPU fixture
        run: |
          npm run build
          npm run test:gpu:fixture
      - name: Install browser regression runner
        run: |
          python3 -m venv .browser-venv
          .browser-venv/bin/pip install --disable-pip-version-check playwright==1.57.0
          .browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Production startup, Chinese UI and mirror regressions (synthetic media)
        run: timeout 180s .browser-venv/bin/python tests/browser_smoke.py --require-gpu
      - name: Real WebGL quad pixels (synthetic media, no real camera or model)
        run: timeout 120s .browser-venv/bin/python tests/quad_gpu.py
      - name: Face preset opt-in, retry, advanced mode and exit (synthetic Worker)
        run: timeout 120s .browser-venv/bin/python tests/face_ui.py
      - name: Actual FaceTracker with blank frames and pinned official portrait fixture
        id: face_worker
        run: timeout 120s .browser-venv/bin/python tests/face_worker.py
      - name: Diagnose raw SDK timing after a failed face gate (never a release pass)
        if: failure() && steps.face_worker.outcome == 'failure'
        continue-on-error: true
        run: timeout 180s .browser-venv/bin/python tests/face_benchmark.py
      - name: Record exact tested build identity
        run: |
          printf '{"commit":"%s","run_id":"%s","validation":"synthetic WebGL + official Face Worker fixture; user camera/hardware unverified"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/build-info.json
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > test-results/tested-dist.sha256
      - name: Save only tested deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: tested-dist-${{ github.run_id }}
          path: dist/
          retention-days: 14
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-${{ github.run_id }}
          path: test-results/
          retention-days: 14
