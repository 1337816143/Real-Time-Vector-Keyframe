name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Install browser regression runner
        run: |
          python3 -m venv .browser-venv
          .browser-venv/bin/pip install --disable-pip-version-check playwright==1.57.0
          .browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Studio startup, Chinese UI and mirror regressions
        run: timeout 180s .browser-venv/bin/python tests/browser_smoke.py --require-gpu
      - name: Save tested build and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-${{ github.run_id }}
          path: |
            dist/
            test-results/browser/
          retention-days: 7
