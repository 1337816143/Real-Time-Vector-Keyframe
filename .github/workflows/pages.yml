name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the exact tested artifact (never rebuild for deployment)
        uses: actions/download-artifact@v4
        with:
          name: tested-dist-${{ github.run_id }}
          path: dist
      - name: Configure existing Pages site
        uses: actions/configure-pages@v5
      - name: Upload tested Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
